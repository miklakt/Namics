[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "namics"
version = "0.1.0"
description = "Experimental Python-driven self-consistent field calculations"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["namics*"]
